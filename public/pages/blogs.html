<section class="bg-[#f7fbff] text-[#071f4d]">
  <!-- Hero -->
  <!-- Hero -->
  <div
    class="relative isolate overflow-hidden border-b border-[#e4edf8] bg-[#eef6ff]"
  >
    <picture class="absolute inset-0 h-full w-full">
      <!-- Mobile Banner -->
      <source
        media="(max-width: 767px)"
        srcset="
          /images/banner/mobile-banner/a_wide_modern_futuristic_interior_scene_a_high.avif
        "
      />

      <!-- Desktop Banner -->
      <img
        src="/images/blog/hero/futuristic_tech_showroom_with_digital_displays.avif"
        alt="GCTL LED Blogs"
        loading="eager"
        fetchpriority="high"
        decoding="async"
        class="h-full w-full object-cover object-[72%_center] md:object-[70%_center]"
      />
    </picture>

    <!-- Overlay -->
    <div
      class="absolute inset-0 bg-gradient-to-b from-[#f7fbff] via-[#f7fbff]/95 to-[#f7fbff]/45 md:bg-gradient-to-r md:from-[#f7fbff] md:via-[#f7fbff]/94 md:to-[#f7fbff]/25"
    ></div>

    <div class="relative z-10 mx-auto max-w-[1320px] px-4 sm:px-6 lg:px-8">
      <div
        class="relative flex min-h-[520px] items-start py-10 sm:min-h-[560px] sm:py-12 md:min-h-[350px] md:items-center md:py-10 lg:min-h-[330px]"
      >
        <div class="max-w-[650px]">
          <!-- Breadcrumb -->
          <div
            class="mb-4 flex items-center gap-2.5 text-[12px] font-normal text-[#617187]"
          >
            <a href="/index.html" class="transition hover:text-[#0068d9]">
              Home
            </a>

            <span class="text-[#9aaabd]">›</span>

            <span class="text-[#071f4d]">Blogs</span>
          </div>

          <!-- Small Label -->
          <p
            class="mb-2 text-[10px] font-medium uppercase tracking-[0.18em] text-[#0068d9] sm:text-[11px]"
          >
            Latest Insights
          </p>

          <!-- Hero Heading -->
          <h1
            class="max-w-[640px] text-[27px] font-medium leading-[1.18] tracking-[-0.4px] text-[#071f4d] sm:text-[34px] sm:leading-[1.15] lg:text-[42px]"
          >
            News, Guides &amp; Insights for LED Display Solutions
          </h1>

          <!-- Hero Description -->
          <p
            class="mt-4 max-w-[580px] text-[13px] font-normal leading-6 text-[#40556d] sm:text-[14px] sm:leading-7"
          >
            Explore expert guides, industry trends, and practical ideas about
            LED display, digital signage, video wall, kiosk and billboard
            solutions.
          </p>
        </div>

        <!-- YouTube Play Button -->
        <button
          type="button"
          data-youtube-video="dQw4w9WgXcQ"
          data-youtube-title="GCTL LED Blogs Video"
          aria-label="Play blogs video"
          class="absolute bottom-9 left-1/2 grid h-[64px] w-[64px] -translate-x-1/2 place-items-center rounded-full border-2 border-red-500 bg-transparent text-red-500 shadow-[0_14px_38px_rgba(15,23,42,0.25)] transition duration-300 hover:scale-105 hover:bg-red-500 hover:text-white md:bottom-auto md:left-[76%] md:top-1/2 md:h-[72px] md:w-[72px] md:-translate-x-1/2 md:-translate-y-1/2"
        >
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
            class="h-7 w-7"
          >
            <path d="M9 6.5v11l8.5-5.5L9 6.5Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div> 

  <!-- Blogs -->
  <div
    class="mx-auto max-w-[1320px] px-4 py-9 sm:px-6 sm:py-10 lg:px-8 lg:py-12"
  >
    <!-- Section Heading -->
    <div
      class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"
    >
      <div>
        <p
          class="text-[10px] font-medium uppercase tracking-[0.18em] text-[#0068d9] sm:text-[11px]"
        >
          All Blogs
        </p>

        <h2
          class="mt-2 text-[23px] font-medium leading-tight tracking-[-0.3px] text-[#071f4d] sm:text-[27px]"
        >
          View All Blogs
        </h2>
      </div>

      <p id="blogsCount" class="text-[12px] font-normal text-[#5a6d84]"></p>
    </div>

    <!-- Blog Categories -->
    <div class="mb-7">
      <!-- Mobile Filter -->
      <div
        class="rounded-[12px] border border-[#dbe8f5] bg-white p-3.5 shadow-[0_12px_35px_rgba(7,31,77,0.06)] md:hidden"
      >
        <label
          for="blogsCategorySelect"
          class="mb-2 block text-[10px] font-medium uppercase tracking-[0.1em] text-[#5a6d84]"
        >
          Filter Blogs
        </label>

        <div class="relative">
          <select
            id="blogsCategorySelect"
            class="h-11 w-full appearance-none rounded-[8px] border border-[#d7e4f2] bg-white px-3.5 pr-10 text-[13px] font-normal text-[#071f4d] outline-none transition focus:border-[#0068d9] focus:ring-2 focus:ring-[#0068d9]/10"
          ></select>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="pointer-events-none absolute right-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-[#0068d9]"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </div>
      </div>

      <!-- Tablet/Desktop Slider -->
      <div
        class="hidden rounded-[12px] border border-[#dbe8f5] bg-white p-3.5 shadow-[0_14px_40px_rgba(7,31,77,0.06)] md:block"
      >
        <div class="flex items-center gap-3">
          <!-- Previous Button -->
          <button
            type="button"
            id="blogsCategoryPrev"
            aria-label="Previous categories"
            class="grid h-11 w-11 shrink-0 place-items-center rounded-[8px] border border-[#d7e4f2] bg-white text-[#071f4d] transition hover:border-[#0068d9] hover:bg-[#0068d9] hover:text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-5 w-5"
            >
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>

          <!-- Categories -->
          <div
            id="blogsCategories"
            class="flex flex-1 gap-3 overflow-x-auto scroll-smooth whitespace-nowrap pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
          ></div>

          <!-- Next Button -->
          <button
            type="button"
            id="blogsCategoryNext"
            aria-label="Next categories"
            class="grid h-11 w-11 shrink-0 place-items-center rounded-[8px] border border-[#d7e4f2] bg-white text-[#071f4d] transition hover:border-[#0068d9] hover:bg-[#0068d9] hover:text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="h-5 w-5"
            >
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Blogs Grid -->
    <div
      id="blogsGrid"
      class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
    ></div>
  </div>

  <!-- Blogs YouTube Video Modal -->
  <div
    data-blogs-video-modal
    aria-hidden="true"
    class="fixed inset-0 z-[120] hidden items-center justify-center px-3 py-6 sm:px-6"
  >
    <!-- Dark Background -->
    <button
      type="button"
      data-blogs-video-close
      aria-label="Close video"
      class="absolute inset-0 h-full w-full cursor-default bg-black/80 backdrop-blur-[2px]"
    ></button>

    <!-- Video Box -->
    <div
      role="dialog"
      aria-modal="true"
      aria-label="GCTL LED blog video"
      class="relative z-10 w-full max-w-[920px] overflow-hidden rounded-[14px] border border-white/10 bg-black shadow-[0_30px_90px_rgba(0,0,0,0.55)]"
    >
      <!-- Close Button -->
      <button
        type="button"
        data-blogs-video-close
        aria-label="Close video"
        class="absolute right-2 top-2 z-20 grid h-10 w-10 place-items-center rounded-full bg-black/70 text-[25px] font-medium leading-none text-white transition hover:bg-white hover:text-black"
      >
        ×
      </button>

      <div class="aspect-video w-full bg-black">
        <iframe
          data-blogs-video-frame
          src=""
          title="GCTL LED blog video"
          loading="lazy"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
          class="h-full w-full"
        ></iframe>
      </div>
    </div>
  </div>
</section>
