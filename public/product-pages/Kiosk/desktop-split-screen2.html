<!-- Smart Digital Poster -->
<section class="relative py-24 overflow-hidden bg-linear-to-b from-slate-50 via-white to-blue-50">

    <!-- Background Glow -->
    <div class="absolute -top-20 -left-20 w-80 h-80 bg-sky-300/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-blue-300/20 rounded-full blur-3xl"></div>

    <!-- Floating Shapes -->
    <div class="absolute top-40 left-10 w-6 h-6 bg-sky-400/30 rounded-full animate-bounce"></div>
    <div class="absolute bottom-40 right-20 w-8 h-8 bg-blue-500/20 rounded-full animate-pulse"></div>

    <div class="max-w-7xl mx-auto px-5">

        <!-- Heading -->
         
        <div class="text-center relative mb-14 lg:mb-20" data-aos="fade-down" data-aos-duration="1000">

            <!-- Background Text -->
            <h2 class="absolute inset-0 flex justify-center text-4xl md:text-6xl lg:text-7xl font-extrabold uppercase text-slate-300/20 select-none pointer-events-none">
                Smart Digital Poster
            </h2>

            <div class="relative z-10">

                <span class="inline-flex px-5 py-2 rounded-full bg-sky-100 text-sky-600 font-semibold text-sm shadow-sm">
                    Split Screen Display
                </span>

                <h3 class="mt-5 text-3xl md:text-5xl font-extrabold">

                    <span class="text-sky-500">
                        Smart Digital
                    </span>

                    <span class="text-blue-700">
                        Poster
                    </span>

                </h3>

                <div class="flex justify-center items-center gap-2 mt-4">
                    <span class="w-2 h-2 bg-sky-500 rounded-full"></span>
                    <span class="w-12 h-1 bg-sky-500 rounded-full"></span>
                    <span class="w-2 h-2 bg-sky-500 rounded-full"></span>
                </div>

                <p class="max-w-4xl mx-auto mt-6 text-gray-600 text-lg">
                    Flexible content display solution with multiple screen layouts and multimedia presentation support.
                </p>

                <!-- Split Screen Preview -->
                <div
                    class="flex justify-center mt-10"
                    data-aos="zoom-in"
                    data-aos-delay="200">

                    <img
                        src="/dsdk-images/split-screen-all.avif"
                        class="w-72 md:w-80 object-contain hover:scale-105 transition duration-500"
                        alt="Split Screen">

                </div>

            </div>

        </div>

        <!-- Main Layout -->
        <div class="grid lg:grid-cols-12 gap-10 items-center">

            <!-- Left Display -->
            <div
                class="lg:col-span-3 flex justify-center" data-aos="fade-right" data-aos-delay="200">

                <div class="group relative">

                    <!-- Glow -->
                    <div class="absolute inset-0 bg-sky-400/20 blur-2xl rounded-3xl scale-90 group-hover:scale-110 transition duration-700"></div>

                    <div class="relative rounded-2xl overflow-hidden bg-white shadow-2xl border border-slate-200">

                        <img
                            src="/dsdk-images/split-screen-default1.avif"
                            class="w-70 md:w-[320px] object-contain transition duration-700 group-hover:scale-105"
                            alt="Default Layout">

                    </div>

                </div>

            </div>

            <!-- Arrow -->
            <div
                class="lg:col-span-1 flex justify-center" data-aos="fade-right" data-aos-delay="300">

                <div class="relative">

                    <span class="absolute inset-0 bg-sky-400/30 blur-xl rounded-full animate-pulse"></span>

                    <img
                        src="/dsdk-images/right-arrow.webp"
                        alt="Arrow"
                        class="relative w-24 lg:w-28 animate-pulse">

                </div>

            </div>

            <!-- Right Side -->
            <div
                class="lg:col-span-8">

                <div class="grid md:grid-cols-3 gap-6">

                    <!-- Item 1 -->
                    <div
                        class="group relative overflow-hidden rounded-2xl shadow-xl bg-white border border-slate-200"
                        data-aos="fade-right" data-aos-delay="450">

                        <div class="absolute inset-0 bg-sky-500/0 group-hover:bg-sky-500/5 transition duration-500"></div>

                        <img
                            src="/dsdk-images/split-screen-2.avif"
                            class="w-full h-full object-cover transition duration-700 group-hover:scale-110"
                            alt="Layout 2">

                    </div>

                    <!-- Item 2 -->
                    <div
                        class="group relative overflow-hidden rounded-2xl shadow-xl bg-white border border-slate-200"
                        data-aos="fade-right" data-aos-delay="600">

                        <div class="absolute inset-0 bg-blue-500/0 group-hover:bg-blue-500/5 transition duration-500"></div>

                        <img
                            src="/dsdk-images/split-screen-3.avif"
                            class="w-full h-full object-cover transition duration-700 group-hover:scale-110"
                            alt="Layout 3">

                    </div>

                    <!-- Item 3 -->
                    <div
                        class="group relative overflow-hidden rounded-2xl shadow-xl bg-white border border-slate-200"
                        data-aos="fade-right" data-aos-delay="750">

                        <div class="absolute inset-0 bg-indigo-500/0 group-hover:bg-indigo-500/5 transition duration-500"></div>

                        <img
                            src="/dsdk-images/split-screen-4.avif"
                            class="w-full h-full object-cover transition duration-700 group-hover:scale-110"
                            alt="Layout 4">

                    </div>

                </div>

                <!-- Bottom Features -->
                

            </div>

        </div>

    </div>

</section>
